name: MPC ceremony release validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly full production-sized compatibility run (02:17 UTC).
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: mpc-ceremony-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Update this only after reviewing the Relay change and rerunning this gate.
  RELAY_COMMIT: 0e631b319199254512ca753ed6f2d6c650fe3383

jobs:
  rehearsal-reproducibility:
    name: Reproducible unsigned rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify release inputs
        shell: bash
        run: |
          test "$(go env GOVERSION)" = go1.26.5
          test "$(go env GOHOSTOS)" = linux
          test "$(go env GOHOSTARCH)" = amd64
          test "$(sed -n 's/^module //p' go.mod)" = proof-tool

      - name: Bootstrap patched vendor tree
        run: bash scripts/bootstrap-vendor.sh

      - name: Build two unsigned rehearsals
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/mpc-rehearsal-a-parent"
          mkdir "$RUNNER_TEMP/mpc-rehearsal-b-parent"
          scripts/build-mpc-ceremony-release.sh \
            --mode rehearsal \
            --out-dir "$RUNNER_TEMP/mpc-rehearsal-a-parent/release"
          scripts/build-mpc-ceremony-release.sh \
            --mode rehearsal \
            --out-dir "$RUNNER_TEMP/mpc-rehearsal-b-parent/release"

      - name: Verify byte-for-byte reproducibility
        shell: bash
        run: |
          scripts/verify-mpc-ceremony-reproducible.sh \
            --mode rehearsal \
            --expected-commit "$GITHUB_SHA" \
            --expected-tag none \
            --tag-signer-fingerprint none \
            --trusted-build-public-key-file none \
            "$RUNNER_TEMP/mpc-rehearsal-a-parent/release" \
            "$RUNNER_TEMP/mpc-rehearsal-b-parent/release"

      - name: Exercise download-only tiny rehearsal initialization
        shell: bash
        run: |
          set -euo pipefail
          ceremony_binary="$RUNNER_TEMP/mpc-rehearsal-a-parent/release/mpc-ceremony"
          rehearsal_root="$RUNNER_TEMP/downloadable-tiny-rehearsal"
          "$ceremony_binary" rehearsal init \
            --created-at 2026-08-20T06:00:00Z \
            --out-dir "$rehearsal_root"
          "$ceremony_binary" --format json inspect definition \
            --ceremony "$rehearsal_root/public/ceremony.json" \
            --ceremony-signature "$rehearsal_root/public/ceremony.sig" \
            --coordinator-public-key-file \
              "$rehearsal_root/public/coordinator-public-key.hex" \
            >"$RUNNER_TEMP/downloadable-tiny-definition.json"
          python3 - "$RUNNER_TEMP/downloadable-tiny-definition.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "rb") as handle:
              result = json.load(handle)
          inspection = result["definition_inspection"]
          assert result["ok"] is True
          assert inspection["mode"] == "rehearsal"
          assert inspection["phase1_participants"] == [
              "participant-01", "participant-02", "participant-03"
          ]
          PY
          test -f "$rehearsal_root/config/environment.json"
          test -f "$rehearsal_root/keys/coordinator.ed25519.private.hex"
          test "$(stat -c %a "$rehearsal_root/keys/coordinator.ed25519.private.hex")" = 600
          if "$ceremony_binary" rehearsal init \
            --created-at 2026-08-20T06:00:01Z \
            --out-dir "$rehearsal_root"; then
            echo "rehearsal initializer overwrote an existing root" >&2
            exit 1
          fi
          test -f "$rehearsal_root/public/ceremony.json"

      - name: Confirm rehearsal packages are unsigned
        shell: bash
        run: |
          for release in \
            "$RUNNER_TEMP/mpc-rehearsal-a-parent/release" \
            "$RUNNER_TEMP/mpc-rehearsal-b-parent/release"
          do
            test "$(<"$release/build-mode.txt")" = rehearsal
            test "$(<"$release/signed-tag.txt")" = none
            test "$(<"$release/signed-tag-status.txt")" = not-required-for-rehearsal
            test ! -e "$release/build-package-manifest.sig"
            test ! -e "$release/build-package-manifest-public-key.hex"
          done

  relay-compatibility:
    name: Relay CLI compatibility (pinned commit)
    needs: rehearsal-reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out proof-tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: proof-tool
          fetch-depth: 0
          persist-credentials: false

      - name: Check out pinned Relay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zksecurity/relay
          ref: ${{ env.RELAY_COMMIT }}
          path: relay
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: proof-tool/go.mod
          cache: false

      - name: Bootstrap patched proof-tool vendor tree
        working-directory: proof-tool
        run: bash scripts/bootstrap-vendor.sh

      - name: Exercise the fast proof-tool CLI boundary
        shell: bash
        run: |
          test "$(git -C relay rev-parse HEAD)" = "$RELAY_COMMIT"
          cd relay
          # Fast layer only: tiny-circuit CLI/format compatibility. The
          # production-sized cryptographic workflow runs in the
          # relay-full-compatibility job below when crypto-relevant paths
          # change, nightly, or on manual dispatch.
          RELAY_PROOF_TOOL_DIR="$GITHUB_WORKSPACE/proof-tool" \
            go test ./cmd/relay \
              -run '^TestProofToolCompatibility$' \
              -count=1 \
              -timeout 30m \
              -v

  detect-crypto-changes:
    name: Detect crypto-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      crypto: ${{ steps.diff.outputs.crypto }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compare changed paths against the crypto surface
        id: diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = schedule ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "crypto=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = pull_request ]; then
            git fetch -q origin "$BASE_REF"
            range="$(git merge-base "origin/$BASE_REF" HEAD)..HEAD"
          elif git cat-file -e "$PUSH_BEFORE" 2>/dev/null; then
            range="$PUSH_BEFORE..$GITHUB_SHA"
          else
            # Unknown base (e.g. force push): fail open into the full gate.
            echo "crypto=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$range")
          printf 'changed files:\n%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -qE '^(experiments/wasm-prover/patches/|scripts/bootstrap-vendor\.sh|scripts/check-vendor-drift\.sh|internal/mpcceremony/|internal/circuit/|cmd/mpc-ceremony/|go\.(mod|sum)$|\.github/workflows/mpc-ceremony-release-validation\.yml$)'; then
            echo "crypto=true" >>"$GITHUB_OUTPUT"
          else
            echo "crypto=false" >>"$GITHUB_OUTPUT"
          fi

  relay-full-compatibility:
    name: Relay production-sized compatibility (patched crypto gate)
    needs: [rehearsal-reproducibility, detect-crypto-changes]
    if: needs.detect-crypto-changes.outputs.crypto == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Check out proof-tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: proof-tool
          fetch-depth: 0
          persist-credentials: false

      - name: Check out pinned Relay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zksecurity/relay
          ref: ${{ env.RELAY_COMMIT }}
          path: relay
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: proof-tool/go.mod
          cache: false

      - name: Bootstrap patched proof-tool vendor tree
        working-directory: proof-tool
        run: bash scripts/bootstrap-vendor.sh

      - name: Exercise the production-sized cryptographic workflow
        shell: bash
        run: |
          test "$(git -C relay rev-parse HEAD)" = "$RELAY_COMMIT"
          cd relay
          # Production-sized init + contribute + attest + verify measured at
          # roughly 55-60 minutes total on ubuntu-latest (contribution alone
          # about 22 minutes); budget with margin for runner variance.
          RELAY_PROOF_TOOL_DIR="$GITHUB_WORKSPACE/proof-tool" \
          RELAY_PROOF_TOOL_FULL=1 \
            go test ./cmd/relay \
              -run '^TestProofToolCompatibility$' \
              -count=1 \
              -timeout 95m \
              -v
